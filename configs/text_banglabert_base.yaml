# BanglaBERT-base text branch, multi-seed averaged (seeds 123, 456).
tag:          text_bbB
modality:     text
text_model:   csebuetnlp/banglabert
max_len:      256
pooling:      mean
batch_size:   8
grad_accum:   4
epochs:       4
lr_text:      8.0e-6
lr_head:      5.0e-4
weight_decay: 0.01
warmup_ratio: 0.10
label_smooth: 0.05
gamma:        2.0
seeds:        [123, 456]
oof_out:      artifacts/oof_banglabert_base.npy
