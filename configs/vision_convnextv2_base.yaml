name: vision_convnextv2_base
modality: image
model_name: convnextv2_base.fcmae_ft_in22k_in1k_384  # confirm from notebook
image_size: 384
drop_path_rate: 0.10
tta_views: 5
loss: {type: focal_label_smoothing, gamma: 2.0, smoothing: 0.05}
optimizer: {type: adamw, lr_backbone: 1.0e-5, lr_head: 5.0e-4, weight_decay: 0.01}
scheduler: {type: cosine, warmup_ratio: 0.10}
train: {epochs: 6, micro_batch: 8, grad_accum: 4, amp: true}
folds: data/folds/folds_canonical.csv
oof_out: artifacts/oof_convnextv2_base.npy
