# MuRIL-Large text branch (confirmed checkpoint from the notebook).
tag:          text_murilL
modality:     text
text_model:   google/muril-large-cased
max_len:      256
pooling:      mean
batch_size:   4
grad_accum:   8
epochs:       4
lr_text:      8.0e-6
lr_head:      5.0e-4
weight_decay: 0.01
warmup_ratio: 0.10
label_smooth: 0.05
gamma:        2.0
seeds:        [42]
oof_out:      artifacts/oof_muril_large.npy
