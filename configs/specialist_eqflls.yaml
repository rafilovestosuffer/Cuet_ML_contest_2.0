# 3-class specialist on {Earthquake, Flood, Landslides} + multiplicative
# power-fusion into the 8-class posterior. beta grid matches the notebook.
tag:          spec_eqflls
modality:     text
classes:      [Earthquake, Flood, Landslides]
class_ids:    [1, 2, 4]
text_model:   google/muril-large-cased
max_len:      256
batch_size:   8
grad_accum:   4
epochs:       4
lr_text:      8.0e-6
lr_head:      5.0e-4
weight_decay: 0.01
warmup_ratio: 0.10
label_smooth: 0.05
gamma:        2.0
fusion_type:  multiplicative_power
beta_grid:    [0.3, 0.5, 0.7, 0.9, 1.1, 1.3, 1.5]
seed:         42
oof_out:      artifacts/oof_specialist.npy
