name: fusion_eva02_muril
modality: multimodal
text_model: google/muril-large-cased
image_model: eva02_large_patch14_448.mim_m38m_ft_in22k_in1k
d_f: 512
n_heads: 8
dropout: 0.1
loss: {type: focal_label_smoothing, gamma: 2.0, smoothing: 0.05}
optimizer: {type: adamw, lr_backbone: 1.0e-5, lr_head: 5.0e-4, weight_decay: 0.01}
scheduler: {type: cosine, warmup_ratio: 0.10}
train: {epochs: 5, micro_batch: 4, grad_accum: 8, amp: true, grad_checkpoint: true}
folds: data/folds/folds_canonical.csv
oof_out: artifacts/oof_fusion_eva_muril.npy
